<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<text x="24" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#212529" text-anchor="start">Stage 1 -- Pi &lt;-&gt; Teensy over USB</text>
<text x="24" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#495057" text-anchor="start">Nothing else connected. Proves: Pi setup, compile + flash from the Pi, USB serial.</text>
<rect x="520" y="110" width="200" height="82" rx="8" fill="#e6fcf5" stroke="#343a40" stroke-width="1.5"/>
<text x="620.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Teensy 4.0</text>
<text x="620.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">flash: usb_hello</text>
<circle cx="520" cy="171.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="530" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">USB (micro)</text>
<circle cx="720" cy="171.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="710" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">13 LED (onboard)</text>
<rect x="80" y="110" width="170" height="82" rx="8" fill="#fff0f6" stroke="#343a40" stroke-width="1.5"/>
<text x="165.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Raspberry Pi 5</text>
<text x="165.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">own 5 V 5 A USB-C supply</text>
<circle cx="250" cy="171.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="240" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">USB-A</text>
<polyline points="250.0,171.0 280.0,171.0 385.0,171.0 385.0,171.0 490.0,171.0 520.0,171.0" fill="none" stroke="#868e96" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="282.7" y="162.0" width="99.6" height="17" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
<text x="332.5" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">USB data cable</text>
<rect x="80" y="220" width="520" height="79" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="92" y="239" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="92" y="257" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">The LED blinks once per second.</text>
<text x="92" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Pi shows the Teensy as /dev/ttyACM0.</text>
<text x="92" y="291" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Typing 'ping' in tvc_logger.py answers '# pong'.</text>
<rect x="620" y="220" width="260" height="79" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="632" y="239" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c7ed6" text-anchor="start">NOTE</text>
<text x="632" y="257" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Cheap micro-USB cables are often</text>
<text x="632" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">power-only: if no ttyACM0 appears,</text>
<text x="632" y="291" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">try another cable first.</text>
<text x="760" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#495057" text-anchor="start">WIRE COLORS</text>
<line x1="760" y1="126" x2="788" y2="126" stroke="#868e96" stroke-width="4"/>
<text x="796" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">USB</text>
</svg>
