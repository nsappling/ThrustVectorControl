<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490">
<rect width="1100" height="490" fill="#ffffff"/>
<text x="24" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#212529" text-anchor="start">Stage 2 -- IMU (GY-521) on the Teensy</text>
<text x="24" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#495057" text-anchor="start">4 wires. Wire IDs = docs/icd/imu_i2c.md. Flash: firmware/tests/imu_test</text>
<rect x="400" y="100" width="210" height="186" rx="8" fill="#e6fcf5" stroke="#343a40" stroke-width="1.5"/>
<text x="505.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Teensy 4.0</text>
<text x="505.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">3.3 V logic, NOT 5 V tolerant</text>
<circle cx="400" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="410" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">USB (micro)</text>
<circle cx="610" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="600" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">3.3V</text>
<circle cx="610" cy="187.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="600" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">GND</text>
<circle cx="610" cy="213.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="600" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">19 (SCL)</text>
<circle cx="610" cy="239.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="600" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">18 (SDA)</text>
<circle cx="610" cy="265.0" r="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<text x="600" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="end">3 (INT)</text>
<rect x="780" y="100" width="190" height="186" rx="8" fill="#fff9db" stroke="#343a40" stroke-width="1.5"/>
<text x="875.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">GY-521 (MPU-6050)</text>
<text x="875.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">I2C address 0x68</text>
<circle cx="780" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="790" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">VCC</text>
<circle cx="780" cy="187.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="790" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">GND</text>
<circle cx="780" cy="213.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="790" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">SCL</text>
<circle cx="780" cy="239.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="790" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">SDA</text>
<circle cx="780" cy="265.0" r="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<text x="790" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="start">INT</text>
<circle cx="970" cy="161.0" r="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<text x="960" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="end">AD0  (leave open)</text>
<circle cx="970" cy="187.0" r="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<text x="960" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="end">XDA  (open)</text>
<circle cx="970" cy="213.0" r="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<text x="960" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="end">XCL  (open)</text>
<rect x="60" y="100" width="170" height="82" rx="8" fill="#fff0f6" stroke="#343a40" stroke-width="1.5"/>
<text x="145.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Raspberry Pi 5</text>
<text x="145.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">own 5 V 5 A USB-C supply</text>
<circle cx="230" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="220" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">USB-A</text>
<polyline points="230.0,161.0 260.0,161.0 315.0,161.0 315.0,161.0 370.0,161.0 400.0,161.0" fill="none" stroke="#868e96" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="272.9" y="152.0" width="29.2" height="17" rx="4" fill="#ffffff" stroke="#868e96" stroke-width="1"/>
<text x="287.5" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">USB</text>
<polyline points="610.0,161.0 634.0,161.0 695.0,161.0 695.0,161.0 756.0,161.0 780.0,161.0" fill="none" stroke="#f08c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="653.1" y="152.0" width="22.8" height="17" rx="4" fill="#ffffff" stroke="#f08c00" stroke-width="1"/>
<text x="664.5" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">I1</text>
<polyline points="610.0,187.0 634.0,187.0 695.0,187.0 695.0,187.0 756.0,187.0 780.0,187.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="653.1" y="178.0" width="22.8" height="17" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="664.5" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">I2</text>
<polyline points="610.0,213.0 634.0,213.0 695.0,213.0 695.0,213.0 756.0,213.0 780.0,213.0" fill="none" stroke="#c9a227" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="653.1" y="204.0" width="22.8" height="17" rx="4" fill="#ffffff" stroke="#c9a227" stroke-width="1"/>
<text x="664.5" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">I3</text>
<polyline points="610.0,239.0 634.0,239.0 695.0,239.0 695.0,239.0 756.0,239.0 780.0,239.0" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="653.1" y="230.0" width="22.8" height="17" rx="4" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
<text x="664.5" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">I4</text>
<rect x="60" y="310" width="520" height="113" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
<text x="72" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e03131" text-anchor="start">WARNING</text>
<text x="72" y="347" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Teensy 4.0 (USB end up): right row from the top is</text>
<text x="72" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">VIN, GND, 3.3V, 23, 22, 21, 20, 19, 18, ...; left row</text>
<text x="72" y="381" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">is GND, 0, 1, 2, ... (check the PJRC pinout card).</text>
<text x="72" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Power the IMU from 3.3V, NOT VIN/5V: that keeps its</text>
<text x="72" y="415" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">I2C pull-ups at a Teensy-safe 3.3 V.</text>
<rect x="600" y="310" width="470" height="113" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="612" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="612" y="347" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Boot shows 'device at 0x68' and WHO_AM_I.</text>
<text x="612" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Flat and still: |accel| ~ 1.00 g, gyro ~ 0 deg/s.</text>
<text x="612" y="381" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Tilt the way the rocket tips: angle_x (or angle_y)</text>
<text x="612" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">follows, POSITIVE when the nose tips toward +x.</text>
<text x="612" y="415" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">'n' noise check: angle std &lt; ~0.1 deg.</text>
<text x="60" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#495057" text-anchor="start">WIRE COLORS</text>
<line x1="60" y1="216" x2="88" y2="216" stroke="#868e96" stroke-width="4"/>
<text x="96" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">USB</text>
<line x1="60" y1="234" x2="88" y2="234" stroke="#f08c00" stroke-width="4"/>
<text x="96" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">3.3 V</text>
<line x1="60" y1="252" x2="88" y2="252" stroke="#222222" stroke-width="4"/>
<text x="96" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">GND</text>
<line x1="60" y1="270" x2="88" y2="270" stroke="#c9a227" stroke-width="4"/>
<text x="96" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">I2C SCL</text>
<line x1="60" y1="288" x2="88" y2="288" stroke="#2f9e44" stroke-width="4"/>
<text x="96" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">I2C SDA</text>
</svg>
