<text x="76" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">3.3 V</text>
<line x1="40" y1="298" x2="68" y2="298" stroke="#222222" stroke-width="4"/>
<text x="76" y="302" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">GND</text>
<line x1="40" y1="316" x2="68" y2="316" stroke="#d6336c" stroke-width="4"/>
<text x="76" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">5 V</text>
