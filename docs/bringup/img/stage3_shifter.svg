<text x="890" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#adb5bd" text-anchor="end">GND </text>
<rect x="40" y="100" width="170" height="82" rx="8" fill="#fff0f6" stroke="#343a40" stroke-width="1.5"/>
<text x="125.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Raspberry Pi 5</text>
<text x="125.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">own 5 V 5 A USB-C supply</text>
<circle cx="210" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="200" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">USB-A</text>
<polyline points="210.0,161.0 240.0,161.0 270.0,161.0 270.0,161.0 300.0,161.0 330.0,161.0" fill="none" stroke="#868e96" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
