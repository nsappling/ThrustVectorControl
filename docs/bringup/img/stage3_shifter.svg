<text x="589.5" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">S5</text>
<polyline points="540.0,239.0 564.0,239.0 615.0,239.0 615.0,239.0 666.0,239.0 690.0,239.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
