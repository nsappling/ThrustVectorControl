<text x="76" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">UART (Teensy TX)</text>
<line x1="40" y1="262" x2="68" y2="262" stroke="#7048e8" stroke-width="4"/>
<text x="76" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">UART (Teensy RX)</text>
