<text x="589.5" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">S4</text>
<polyline points="540.0,213.0 564.0,213.0 615.0,213.0 615.0,213.0 666.0,213.0 690.0,213.0" fill="none" stroke="#f08c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
