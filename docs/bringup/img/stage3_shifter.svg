<rect x="768.6" y="321.0" width="22.8" height="17" rx="4" fill="#ffffff" stroke="#d6336c" stroke-width="1"/>
<text x="780.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">S6</text>
<polyline points="900.0,161.0 990.0,161.0 990.0,161.0 990.0,187.0 900.0,187.0" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="892.0" y="152.0" width="106.0" height="17" rx="4" fill="#ffffff" stroke="#e8590c" stroke-width="1"/>
<text x="945.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#212529" text-anchor="middle">loopback jumper</text>
<rect x="40" y="360" width="500" height="96" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
<text x="52" y="379" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e03131" text-anchor="start">WARNING</text>
<text x="52" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Before connecting the Teensy, check the shifter's labels:</text>
<text x="52" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">LV side = 3.3 V side, HV side = 5 V side. Swapping them</text>
<text x="52" y="431" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">puts 5 V on a Teensy pin. The two GND pins are</text>
<text x="52" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">connected inside the module, so one GND wire is enough.</text>
<circle cx="720" cy="385" r="13" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="720" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e67700" text-anchor="middle">V</text>
<text x="740" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e67700" text-anchor="start">meter: LV pin = 3.3 V,  HV pin = 5.0 V</text>
<rect x="580" y="430" width="490" height="62" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="592" y="449" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="592" y="467" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">'# loopback OK' every second, errors = 0.</text>
<text x="592" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Pull the jumper: '# FAIL: nothing came back' (proves the test works).</text>
<text x="40" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#495057" text-anchor="start">WIRE COLORS</text>
<line x1="40" y1="226" x2="68" y2="226" stroke="#868e96" stroke-width="4"/>
<text x="76" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#212529" text-anchor="start">USB</text>
