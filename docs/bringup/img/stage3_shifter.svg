<text x="890" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">HV1</text>
<circle cx="900" cy="213.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="890" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">HV</text>
