<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<rect width="1100" height="520" fill="#ffffff"/>
<text x="24" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#212529" text-anchor="start">Stage 3 -- Level shifter loopback (no BusLinker, no servo)</text>
<text x="24" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#495057" text-anchor="start">Wire IDs = docs/icd/servo_bus.md. The orange jumper stands in for the BusLinker. Flash: firmware/tests/uart_loopback_test</text>
<rect x="330" y="100" width="210" height="186" rx="8" fill="#e6fcf5" stroke="#343a40" stroke-width="1.5"/>
<text x="435.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">Teensy 4.0</text>
<text x="435.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">3.3 V logic</text>
