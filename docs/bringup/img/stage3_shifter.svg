<text x="530" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">0 (RX1)</text>
<circle cx="540" cy="213.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="530" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">3.3V</text>
<circle cx="540" cy="239.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="530" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">GND</text>
<circle cx="540" cy="265.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="530" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="end">VIN (5 V from USB)</text>
<rect x="690" y="100" width="210" height="160" rx="8" fill="#f3f0ff" stroke="#343a40" stroke-width="1.5"/>
<text x="795.0" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">BSS138 level shifter</text>
<text x="795.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#495057" text-anchor="middle">4-channel, 3.3 V &lt;-&gt; 5 V</text>
<circle cx="690" cy="161.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="700" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">LV2</text>
<circle cx="690" cy="187.0" r="4" fill="#ffffff" stroke="#343a40" stroke-width="1.5"/>
<text x="700" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529" text-anchor="start">LV1</text>
