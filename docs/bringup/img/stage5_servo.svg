<rect x="40" y="300" width="450" height="130" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
<text x="52" y="319" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e03131" text-anchor="start">WARNING</text>
<text x="52" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">BEFORE wiring TX/RX: power the BusLinker alone</text>
<text x="52" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">and measure its idle TX pin to GND.</text>
<text x="52" y="371" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">  &lt;= 3.3 V: the shifter is optional.</text>
<text x="52" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">  ~5 V: the shifter is REQUIRED (as drawn).</text>
<text x="52" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Header labels aren't published [VERIFY on the board].</text>
<text x="52" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Record both in docs/icd/servo_bus.md.</text>
<rect x="40" y="470" width="520" height="79" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="52" y="489" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="52" y="507" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">'i' reads ID = 1; 'r' reads voltage ~12 V and a position.</text>
<text x="52" y="524" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">'c' centers; '+' / '-' move 10 deg; 'w' sweeps +/-15 deg.</text>
<text x="52" y="541" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Then attach the horn at center and record the trim.</text>
<rect x="600" y="540" width="600" height="62" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="612" y="559" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c7ed6" text-anchor="start">NOTE</text>
<text x="612" y="577" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Cross-check: TX on one side goes to RX on the other (S1-&gt;S2, S3-&gt;S4).</text>
<text x="612" y="594" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">If 'r' shows only your own bytes echoed: swap TX/RX or check the jumpers.</text>
<text x="1200" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#495057" text-anchor="start">WIRE COLORS</text>
