<text x="732" y="469" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="732" y="487" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">'arm', then nose tips toward +x (theta &gt; 0):</text>
<text x="732" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">the fan tilts so its thrust pushes the nose BACK.</text>
<text x="732" y="521" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Wrong way -&gt; flip SERVO_DIR in config.h. 'stop' re-centers.</text>
