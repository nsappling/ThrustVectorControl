<rect x="560" y="370" width="640" height="96" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/>
<text x="572" y="389" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e03131" text-anchor="start">WARNING</text>
<text x="572" y="407" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">EDF clamped to the bench, guard on, NOBODY in line with intake or exhaust.</text>
<text x="572" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Hand on the AC switch / E-stop. Eye protection. Start at 't 0.05'.</text>
<text x="572" y="441" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Air must blow OUT the exhaust: if not, swap any two motor wires (E2).</text>
<text x="572" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Raise THROTTLE_MAX only in small steps, watching the meter (&lt; ~12 A).</text>
<rect x="560" y="500" width="640" height="79" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="572" y="519" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e44" text-anchor="start">PASS WHEN</text>
<text x="572" y="537" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Calibration beeps as the manual describes; 's' always stops the fan;</text>
<text x="572" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">UNPLUGGING the Teensy's USB also stops it (ESC signal-loss protection).</text>
<text x="572" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#212529" text-anchor="start">Each throttle step + current logged in docs/icd/edf_esc.md.</text>
